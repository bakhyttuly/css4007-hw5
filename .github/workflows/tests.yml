name: tests

# Runs the test suite on every push and pull request.
# No API key is needed: the tests use a clearly labelled fake model
# (helpdesk/fake_model.py, "FakeRuleModel ... NOT an LLM"). The real-model
# demonstration (Part 2/3 scenario logs) is run by hand and is NOT part of CI.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests (no API key)
        env:
          OPENAI_API_KEY: ""
        run: python -m pytest -q
